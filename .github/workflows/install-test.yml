name: Install Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    # Installs every mise tool, which can take a while.
    timeout-minutes: 60
    steps:
      # Only provides the local composite action; it clones the repository for
      # the test user itself.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotfiles
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  nixos:
    runs-on: ubuntu-latest
    container: nixos/nix:latest
    timeout-minutes: 30
    steps:
      - name: Enable flake
        run: |
          echo 'experimental-features = nix-command flakes' >> /etc/nix/nix.conf
          nix profile remove man-db wget
      - name: Set HOME to /root
        run: echo "HOME=/root" >> $GITHUB_ENV
      - name: Clone repository
        run: |
          git clone --no-single-branch https://github.com/${{ github.repository }} /root/dotfiles
          cd /root/dotfiles
          git fetch origin ${{ github.sha }}
          git checkout ${{ github.sha }}
          git config --global --add safe.directory "/root/dotfiles"
      - name: Run install script (NixOS environment setup)
        run: |
          cd /root/dotfiles && ./install.sh
        timeout-minutes: 10
      - name: Verify Home Manager installation
        run: |
          export PATH="$HOME/.nix-profile/bin:$PATH" && home-manager --version


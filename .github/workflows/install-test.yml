name: Install Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    # Installs every mise tool, which can take a while.
    timeout-minutes: 60
    steps:
      # Only provides the local composite action; it clones the repository for
      # the test user itself.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotfiles
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Re-running install.sh where Nix is already installed (e.g. an existing
  # non-NixOS machine) must keep that installation and enable flakes.
  preinstalled-nix:
    runs-on: ubuntu-latest
    container: nixos/nix:latest
    timeout-minutes: 30
    steps:
      - name: Prepare environment
        run: |
          nix --extra-experimental-features 'nix-command flakes' profile remove man-db wget
          # Real non-NixOS hosts ship awk; the mise.run installer needs it.
          nix --extra-experimental-features 'nix-command flakes' profile add nixpkgs#gawk
      - name: Set HOME to /root
        run: echo "HOME=/root" >> "$GITHUB_ENV"
      - name: Fetch repository
        # nixos/nix:latest has no /lib64 dynamic linker, so Node-based actions/checkout cannot run here.
        # Fetch the PR head commit from the head repo (works for forks and stays reachable after merge).
        env:
          CLONE_URL: ${{ github.event.pull_request.head.repo.clone_url || format('https://github.com/{0}.git', github.repository) }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init /root/dotfiles
          git -C /root/dotfiles fetch --depth 1 "$CLONE_URL" "$TARGET_SHA"
          git -C /root/dotfiles checkout FETCH_HEAD
          git config --global --add safe.directory "/root/dotfiles"
      - name: Run install script (Nix already installed)
        run: |
          cd /root/dotfiles && ./install.sh
        timeout-minutes: 10
      - name: Verify flakes are enabled
        run: |
          cd /root/dotfiles && nix flake metadata

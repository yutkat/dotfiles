name: Benchmark

#on: [push]
on:
  push:
    branches:
      - main
      - ci

permissions:
  # comment-on-alert posts commit comments
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      # Only provides the local composite action; it clones the repository for
      # the test user itself.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotfiles
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mise-install-args: neovim
      - name: Install packages required benchmark
        run: pacman -S --noconfirm time
      - name: Download previous benchmark data
        uses: actions/cache@v6
        with:
          path: ./cache
          # A unique key makes each run save its updated history; restore-keys loads the latest one.
          key: ${{ runner.os }}-benchmark-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-benchmark
      - name: Run benchmark
        run: |
          sudo -u test bash -c '
            cd /home/test/dotfiles
            export PATH="$HOME/.local/share/mise/shims:$HOME/.nix-profile/bin:$PATH"
            ./.github/scripts/benchmark.sh
          '
      - name: Upload benchmark
        uses: benchmark-action/github-action-benchmark@v1.22.2
        with:
          tool: customSmallerIsBetter
          output-file-path: /tmp/result-benchmark.json
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          #benchmark-data-dir-path: .github/pages/dev/bench
          #gh-pages-branch: gh-pages
          # auto-push: true
          comment-on-alert: true
          alert-comment-cc-users: "@yutkat"
          fail-on-alert: false
          alert-threshold: "150%"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: ./cache

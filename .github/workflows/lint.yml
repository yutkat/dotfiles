name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Update packages
        run: pacman -Syyu --noconfirm
      - name: Install packages for install repository
        run: pacman -S --noconfirm git sudo mise jq
      - uses: actions/checkout@v7
      - name: Configure git safe directory
        # The container user differs from the workspace owner; without this,
        # `git ls-files` in the lint task returns nothing.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run lint (same task as local `mise run lint`)
        # Don't auto-install the full [tools] set just to run this task; only
        # install the pinned tools declared in the task header.
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise trust
          mise tasks info lint --json | jq -r '.tools | to_entries[] | "\(.key)@\(.value)"' | xargs mise install
          mise run lint

  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # cache-nix-action purges superseded caches
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-flake-check-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-flake-check-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-flake-check-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      - name: Check flake
        # Evaluates every host (NixOS via nixosConfigurations, Home Manager via
        # the home-<host> checks) and builds the Home Manager activation packages.
        run: nix flake check

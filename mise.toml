# Repo-scoped tasks and dotfile links: available only while inside this repository.

[tasks.claude-install]
description = "Install/upgrade Claude Code via native installer"
run = "curl -fsSL https://claude.ai/install.sh | bash -s latest"

[tasks.dotfiles-apply]
description = "Re-apply dotfile symlinks from [dotfiles]"
run = "mise bootstrap dotfiles apply --yes"

[tasks.setup]
description = "Install missing tools and run setup tasks (no upgrades)"
run = [
  "mise install",
  "mise run claude-install ::: zsh-completions-sync",
]

[tasks.upgrade-all]
description = "Upgrade all tools"
run = [
  "mise self-update --yes",
  "mise outdated",
  "mise upgrade",
  "mise run --output summary claude-install ::: dotfiles-apply ::: zsh-completions-sync",
  "mise prune --yes",
]

# Sources are relative to this repository root.
[dotfiles]
"~/.zshenv" = { source = ".zshenv" }
"~/.editrc" = { source = ".editrc" }
"~/.claude" = { source = ".config/claude" }
"~/.codex" = { source = ".config/codex" }
# The CLI replaces settings.json on save, so link the directory, not the file.
"~/.gemini/antigravity-cli" = { source = ".config/antigravity-cli" }
# Share global Working Agreements with Claude Code and Codex.
"~/.gemini/config/AGENTS.md" = { source = ".config/codex/AGENTS.md" }
"~/.local/bin/*" = { source = ".local/bin/*" }
"~/.config/*" = { source = ".config/*" }

[tools]
"github:rhysd/actionlint" = "latest"

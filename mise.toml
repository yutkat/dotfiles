# Repo-scoped tools and tasks: available only while inside this repository.
[tools]
"github:NixOS/nixfmt" = "latest"

[tasks.claude-install]
description = "Install/upgrade Claude Code via native installer"
run = "curl -fsSL https://claude.ai/install.sh | bash -s latest"

# [tasks.antigravity-cli-install]
# description = "Install/upgrade Antigravity CLI via native installer"
# run = "rm -f ~/.local/bin/agy && curl -fsSL https://antigravity.google/cli/install.sh | bash"

[tasks.vale-sync]
description = "Download Vale styles/packages defined in .vale.ini"
run = "vale sync"

[tasks.dotfiles-apply]
description = "Re-apply dotfile symlinks from [dotfiles]"
run = "mise bootstrap dotfiles apply --yes"

[tasks.setup]
description = "Install missing tools and run setup tasks (no upgrades)"
run = [
  "mise install",
  "mise run claude-install ::: vale-sync ::: zsh-completions-sync",
]

[tasks.upgrade-all]
description = "Upgrade all tools"
run = [
  "mise outdated",
  "mise upgrade",
  "mise run claude-install ::: dotfiles-apply ::: vale-sync ::: zsh-completions-sync",
  "mise prune --yes",
]

# Sources are relative to this repository root.
[dotfiles]
"~/.zshenv" = { source = ".zshenv" }
"~/.xinitrc" = { source = ".xinitrc" }
"~/.xprofile" = { source = ".xprofile" }
"~/.claude" = { source = ".config/claude" }
"~/.codex" = { source = ".config/codex" }
"~/.config/*" = { source = ".config/*" }
# ~/.config/systemd stays a symlink from the glob: home-manager writes its unit
# links through it into the repo (gitignored). Never use mode = "copy" here;
# copying the dir onto itself truncates files and deletes those links.

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]
# Supply-chain guard for "latest" tools; urgent tools override with 0s.
minimum_release_age = "72h"

[settings.npm]
bun = true

[tools]
neovim = "nightly"
tree-sitter = "latest"
# "aqua:bahdotsh/wrkflw" = "latest"
# "npm:@byterover/cipher" = "latest"
#opencode = "latest"
# Linters/formatters shared by shell, lint tasks, and Neovim (conform/nvim-lint).
# Editor-only LSP servers live in conf.d/neovim.toml.
biome = "latest"
markdownlint-cli2 = "latest"
prettier = "latest"
ruff = "latest"
stylua = "latest"
vale = "latest"
"aqua:Kampfkarren/selene" = "latest"
"github:ewhauser/shuck" = "latest"
"github:NixOS/nixfmt" = "latest"
"npm:markdown-toc" = "latest"
# Standalone CLI tools.
bat = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
ghq = "latest"
jq = "latest"
ripgrep = "latest"
watchexec = "latest"
yq = "latest"
zoxide = "latest"
"aqua:dalance/procs" = "latest"
"aqua:itchyny/mmv" = "latest"
"aqua:knqyf263/pet" = "latest"
"aqua:oberblastmeister/trashy" = "latest"
"aqua:ouch-org/ouch" = "latest"
"aqua:Songmu/ghg" = "latest"
"aqua:tldr-pages/tlrc" = "latest"
"aqua:wakatime/wakatime-cli" = "latest"
"github:Wilfred/difftastic" = "latest"

[tools."npm:@openai/codex"]
version = "latest"
minimum_release_age = "0s"

[tools."npm:@github/copilot"]
version = "latest"
minimum_release_age = "0s"

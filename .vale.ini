StylesPath = .nvim/vale/styles
MinAlertLevel = suggestion
Vocab = Vale

# External packages
Packages = Google, alex, proselint

[*.md]
; BasedOnStyles = Vale, alex, proselint, dotfiles
BasedOnStyles = Vale, alex, proselint
alex.ProfanityMaybe = NO
alex.ProfanityUnlikely = NO
proselint.Typography = NO
; Opt in to individual Google rules; the full style targets product docs
Google.Exclamation = YES
Google.OxfordComma = YES
Google.WordListCase = YES

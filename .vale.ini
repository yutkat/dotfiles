StylesPath = .nvim/vale/styles
MinAlertLevel = suggestion
Vocab = Vale

# External packages
Packages = Google, Readability, alex, proselint

[*.md]
; BasedOnStyles = Vale, Google, Readability, alex, proselint, dotfiles
BasedOnStyles = Vale, Google, Readability, alex, proselint
; Vocab is shared with cspell (plain lowercase words), so Terms would demand lowercase "neovim"
Vale.Terms = NO
Readability.Polysyllables = NO
Google.Parens = NO
Google.Semicolons = NO
